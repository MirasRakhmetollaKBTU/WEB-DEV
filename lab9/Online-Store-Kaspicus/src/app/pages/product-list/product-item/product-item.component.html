<article class="card glass">
  <a [href]="product.link">
    <img [src]="getSelectedImage(product)" [alt]="product.name"/>
  </a>

  <div class="content">
    <h2 class = "name">
      <a [href]="product.link">{{product.name}}</a>
    </h2>
    
    <p class="desc">{{ product.description }}</p>

    <div class="meta">
      <div class="price">{{product.price | number}} ₸</div>

      <div class="rating" [attr.aria-label]="'Rating ' + product.rating">
        <span class="stars">
          @for (s of stars(product.rating); track s)
          { <span class="star" [class.filled]="product.rating+1 >= (s + 1)">★</span> } 
        </span>

        <span class="badge">{{ product.rating }}</span>
      </div>
    </div>

    <div class="thumbs">
      @for (img of product.images; track img; let i = $index)
      { 
        <button class="thumb" type="button"
                [class.active]="getSelectedImage(product) === img"
                (click)="selectImage(product.id, i)">
          <img [src]="img" [alt]="product.name + ' thumbnail ' + (i + 1)" loading="lazy" />
        </button>
      }
    </div>

    <div class="controls">
      <button class="btn" type="button" (click)="like(product)">
        ❤ {{ product.likes }}
      </button>

      <button class="btn danger" type="button" (click)="remove(product.id)">
        Delete
      </button>
    </div>

    <div class="actions">
      <a class="glass btn" [href]="whatsappShare(product)">Share WatsApp</a>
      <a class="glass btn" [href]="telegramShare(product)">Share Telegramm</a>
    </div>
  </div>
</article>
