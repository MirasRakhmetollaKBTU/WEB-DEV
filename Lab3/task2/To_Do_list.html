<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>To Do list</title>
    </head>
    <body>
        <header class="header glass inside-placement-GG_Child">
            <h1>ToDO list</h1>
            <h1 class="sub-title">Add • Done • Delete</h1>
        </header>

        <main>
            <section class="page glass-main">
                <div class="title-row">
                    <h2>
                        ToDo List
                    </h2>

                    <p class="stats" id="Stats_Text">
                        0 tasks
                    </p>
                </div>

                <form id="ToDoForm" autocomplete="off">
                    <label for="TaskInput"></label>
                    <input 
                        type="text"
                        id="TaskInput"
                        placeholder="New Task"
                        maxlength="120"
                        required
                    />

                    <button class="btn-primary" type="submit" id="addBtn">Add</button>
                </form>

                <script src="glass.js"></script>

                <ul id="taskList" autocomplete="off">
                </ul>

                <script src="To_Do_Form.js"></script>
            </section>
        </main>
        
        <footer>

        </footer>
    </body>
</html>
